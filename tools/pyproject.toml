[project]
name = "example-tools"
version = "0.1.0"
description = "Example FastMCP server: Databricks SQL, a custom Python function, and a 3rd-party REST API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "databricks-sql-connector>=3.0.0",
]

[project.scripts]
example-tools = "server:main"

[tool.uv]
package = false
